name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # This is the one place the Linux/macOS/Windows-dispatched code in packages/cli/src/core/
        # (activity.server.ts, trash.server.ts) gets exercised on real OSes — locally it's only ever been
        # verified on Linux for real, with macOS/Windows covered by mocking ps/lsof/PowerShell's execFile.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm install

      # packages/cli/dist/ is git-ignored build output — the root package's `import ... from
      # "sessionforge-cli"` only resolves once it exists, so build must run before typecheck/test on a
      # fresh checkout (this bit us once already: it worked locally only because dist/ from an earlier
      # local build was still sitting on disk, masking the ordering bug).
      - run: npm run build

      - run: npm run typecheck

      - run: npm test

      - name: Smoke-test the built CLI binary
        run: npx sessionforge --help

  # Separate job pinned to the engines.node floor (>=22.5.0) declared in packages/cli/package.json — the
  # matrix above uses whatever "22" latest resolves to, which could quietly drift ahead of that floor.
  minimum-node-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.5.0"
          cache: npm

      # npm's bundled version on 22.5.0 (10.8.2) intermittently dies with "Exit handler never called!" — a
      # known upstream npm bug (npm/cli#4028 and friends), unrelated to anything in this repo — leaving
      # node_modules broken and every later step failing with confusing "Cannot find name 'process'"
      # typecheck errors. Its own exit code is unreliable when this happens (observed exiting nonzero AND
      # exiting 0 across different runs), and a broken install can leave individual files like
      # @types/node/package.json present while the rest of node_modules is still corrupt — so neither the
      # exit code nor a single file-presence check is trustworthy. The literal "npm error" text is the one
      # reliable signal npm always prints when this fires; on seeing it, wipe node_modules and retry from a
      # clean state rather than layering a retry on top of whatever got corrupted.
      - name: npm install (retry on npm's intermittent "Exit handler never called!" bug)
        run: |
          for attempt in 1 2 3; do
            output=$(npm install 2>&1)
            status=$?
            echo "$output"
            if [ "$status" -eq 0 ] && ! echo "$output" | grep -q "npm error"; then
              exit 0
            fi
            echo "npm install failed (attempt $attempt) — known npm bug, cleaning node_modules and retrying..."
            rm -rf node_modules packages/*/node_modules
            sleep 5
          done
          echo "npm install did not succeed after 3 attempts" >&2
          exit 1

      - run: npm run build
      - run: npm run typecheck
      - run: npm test
