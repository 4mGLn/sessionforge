name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # This is the one place the Linux/macOS/Windows-dispatched code in packages/cli/src/core/
        # (activity.server.ts, trash.server.ts) gets exercised on real OSes — locally it's only ever been
        # verified on Linux for real, with macOS/Windows covered by mocking ps/lsof/PowerShell's execFile.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm install

      # packages/cli/dist/ is git-ignored build output — the root package's `import ... from
      # "sessionforge-cli"` only resolves once it exists, so build must run before typecheck/test on a
      # fresh checkout (this bit us once already: it worked locally only because dist/ from an earlier
      # local build was still sitting on disk, masking the ordering bug).
      - run: npm run build

      - run: npm run typecheck

      - run: npm test

      - name: Smoke-test the built CLI binary
        run: npx sessionforge --help

  # Separate job pinned to the engines.node floor (>=22.5.0) declared in packages/cli/package.json — the
  # matrix above uses whatever "22" latest resolves to, which could quietly drift ahead of that floor.
  minimum-node-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.5.0"
          cache: npm

      # npm's version bundled with Node 22.5.0 (10.8.2) has a reproducible "Exit handler never called!"
      # crash on install in this job every single run — confirmed deterministic, not flaky, by watching it
      # fail identically 3 times in a row under a retry loop. A retry can't fix a deterministic bug, so
      # upgrade npm itself instead: 10.9.9 (npm's own latest 10.x patch, `npm view npm@10.9.9 engines`)
      # still only requires node >=20.5.0, so it runs fine on the 22.5.0 floor this job exists to test —
      # only the npm *tool* moves, not the Node *runtime* floor being verified.
      - run: npm install -g npm@10.9.9
      - run: npm install
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
