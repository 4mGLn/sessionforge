name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # This is the one place the Linux/macOS/Windows-dispatched code in packages/cli/src/core/
        # (activity.server.ts, trash.server.ts) gets exercised on real OSes — locally it's only ever been
        # verified on Linux for real, with macOS/Windows covered by mocking ps/lsof/PowerShell's execFile.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm install

      # packages/cli/dist/ is git-ignored build output — the root package's `import ... from
      # "sessionforge"` only resolves once it exists, so build must run before typecheck/test on a
      # fresh checkout (this bit us once already: it worked locally only because dist/ from an earlier
      # local build was still sitting on disk, masking the ordering bug).
      - run: npm run build

      - run: npm run typecheck

      - run: npm test

      - name: Smoke-test the built CLI binary
        run: npx sessionforge --help

  # Separate job pinned to the engines.node floor (>=22.16.0) declared in packages/cli/package.json — the
  # matrix above uses whatever "22" latest resolves to, which could quietly drift ahead of that floor. The
  # floor is 22.16.0, not just "whenever node:sqlite first appears" (22.5.0) — verified empirically by
  # bisecting real Node versions with nvm, not by reading release notes: node:sqlite needs the
  # --experimental-sqlite flag (never passed anywhere in this codebase) before Node 22.13, and its FTS5
  # support — which the search feature depends on — isn't compiled in until 22.16. Re-verify empirically
  # before ever lowering this.
  minimum-node-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm

      - run: npm install
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
