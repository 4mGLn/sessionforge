name: Publish sessionforge-cli

# Manual trigger only — this never runs on a push or PR, so it can't accidentally publish. Requires an
# NPM_TOKEN repo secret (Settings > Secrets and variables > Actions) holding an npm automation token with
# publish rights for the sessionforge-cli package before this can actually succeed.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.5"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      # See ci.yml's minimum-node-version job for the full explanation: npm's bundled version around Node
      # 22.5 can intermittently die with "Exit handler never called!" while its exit code and even
      # individual file presence in node_modules stay unreliable — the "npm error" text is the one signal
      # that always shows up, so detect that and do a clean reinstall.
      - name: npm install (retry on npm's intermittent "Exit handler never called!" bug)
        run: |
          for attempt in 1 2 3; do
            output=$(npm install 2>&1)
            status=$?
            echo "$output"
            if [ "$status" -eq 0 ] && ! echo "$output" | grep -q "npm error"; then
              exit 0
            fi
            echo "npm install failed (attempt $attempt) — known npm bug, cleaning node_modules and retrying..."
            rm -rf node_modules packages/*/node_modules
            sleep 5
          done
          echo "npm install did not succeed after 3 attempts" >&2
          exit 1

      # Same ordering as ci.yml: dist/ (git-ignored) must exist before typecheck can resolve the root
      # package's "sessionforge-cli" import.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

      - name: Publish packages/cli to npm
        run: npm publish --workspace packages/cli --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
