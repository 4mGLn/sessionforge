name: Publish sessionforge

# Manual trigger only — this never runs on a push or PR, so it can't accidentally publish. Requires an
# NPM_TOKEN repo secret (Settings > Secrets and variables > Actions) holding an npm automation token with
# publish rights for the sessionforge package before this can actually succeed.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v4

      # Uses latest "22" rather than pinning the engines.node floor (22.16.0) — ci.yml's
      # minimum-node-version job already covers that; this just needs a modern, working Node/npm to build
      # and publish with.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm install

      # Same ordering as ci.yml: dist/ (git-ignored) must exist before typecheck can resolve the root
      # package's "@aadaa88/sessionforge" import.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

      - name: Publish packages/cli to npm
        run: npm publish --workspace packages/cli --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
