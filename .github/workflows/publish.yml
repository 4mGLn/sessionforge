name: Publish sessionforge-cli

# Manual trigger only — this never runs on a push or PR, so it can't accidentally publish. Requires an
# NPM_TOKEN repo secret (Settings > Secrets and variables > Actions) holding an npm automation token with
# publish rights for the sessionforge-cli package before this can actually succeed.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.5"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      # See ci.yml's minimum-node-version job: npm's version bundled with Node 22.5 (10.8.2) has a
      # reproducible "Exit handler never called!" crash on install — confirmed deterministic there, not
      # flaky. 10.9.9 (npm's own latest 10.x patch) fixes it and still only needs node >=20.5.0.
      - run: npm install -g npm@10.9.9
      - run: npm install

      # Same ordering as ci.yml: dist/ (git-ignored) must exist before typecheck can resolve the root
      # package's "sessionforge-cli" import.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

      - name: Publish packages/cli to npm
        run: npm publish --workspace packages/cli --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
