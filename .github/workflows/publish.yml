name: Publish sessionforge-cli

# Manual trigger only — this never runs on a push or PR, so it can't accidentally publish. Requires an
# NPM_TOKEN repo secret (Settings > Secrets and variables > Actions) holding an npm automation token with
# publish rights for the sessionforge-cli package before this can actually succeed.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.5"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      # See ci.yml's minimum-node-version job for why this retries on the actual on-disk result rather
      # than npm's exit code: npm's bundled version around Node 22.5 can intermittently die with "Exit
      # handler never called!" yet still report success.
      - name: npm install (retry — see ci.yml for details on the known npm bug)
        run: |
          for attempt in 1 2 3; do
            npm install || true
            if [ -f node_modules/@types/node/package.json ]; then
              exit 0
            fi
            echo "node_modules incomplete after npm install (attempt $attempt) — known npm bug, retrying..."
            sleep 5
          done
          echo "npm install did not produce a complete node_modules after 3 attempts" >&2
          exit 1

      # Same ordering as ci.yml: dist/ (git-ignored) must exist before typecheck can resolve the root
      # package's "sessionforge-cli" import.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

      - name: Publish packages/cli to npm
        run: npm publish --workspace packages/cli --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
