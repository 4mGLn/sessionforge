name: Release binaries

# Triggered by pushing a version tag: `git tag v0.3.0 && git push origin v0.3.0`. The tag IS the version —
# the single source of truth, nothing to keep in sync with packages/cli/package.json (whose own version
# field is unrelated and never read for this; this package is never published to npm, see its "private"
# field). workflow_dispatch stays available for re-running the pipeline manually (e.g. while iterating on
# this workflow itself) via an explicit `version` input, without needing to push a throwaway tag.
#
# Builds a standalone sessionforge binary per platform (Node's Single Executable Application feature — no
# Node.js needed on the machine that runs it) and packages the Paseo plugin, attaching both to a GitHub
# Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (no leading v), e.g. 0.3.0"
        required: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve version from the trigger (tag ref, or the manual input)
        id: resolve
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=$MANUAL_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

  build-binaries:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # SEA binaries aren't cross-compilable — each has to be built natively on its own target OS/arch.
          # macos-13 (Intel) was fully retired by GitHub on 2025-12-04 — jobs queue forever with zero
          # runners once that happens, which is exactly what broke this the first time. macos-14 is also
          # mid-deprecation (began 2026-07-06, gone by 2026-11-02), so both entries use the current
          # non-deprecated labels GitHub recommends instead: macos-15-intel for Intel, macos-15 for Apple
          # Silicon. Re-check for deprecation notices before ever reusing a pinned macos-N label here again.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel # Intel
            target: x86_64-apple-darwin
          - os: macos-15 # Apple Silicon
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Uses latest "22" rather than pinning the engines.node floor (22.16.0) — ci.yml's
      # minimum-node-version job already covers that; this just needs a modern, working Node/npm to build
      # binaries with. The resulting binary embeds this build's own Node runtime (SEA), which is separate
      # from — and doesn't need to match — the floor documented for source/npm installs.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm install
      - run: npm run build:binary --workspace packages/cli
        env:
          SESSIONFORGE_VERSION: ${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: sessionforge-${{ matrix.target }}
          path: packages/cli/build/sessionforge-${{ matrix.target }}*
          if-no-files-found: error

  # The Paseo plugin (this repo's root — index.ts, main.client.tsx, src/server/*) isn't OS/arch-specific
  # like the CLI binaries above, so it only needs one job. `sessionforge wire-paseo` downloads this exact
  # asset and points a local `paseo plugin install` at it.
  package-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm install
      - run: npm run package:plugin

      - uses: actions/upload-artifact@v4
        with:
          name: sessionforge-paseo-plugin
          path: build/sessionforge-paseo-plugin.tar.gz
          if-no-files-found: error

  release:
    needs: [version, build-binaries, package-plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "sessionforge v$VERSION" \
            --generate-notes \
            artifacts/*/*
